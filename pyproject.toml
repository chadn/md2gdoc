# Install plumbing for `uv tool install git+https://github.com/chadn/md2gdoc`, which reads project metadata and not
# the script's own PEP 723 header (PD-002). The tool is still the one file, md2gdoc.py; nothing imports this package.
[project]
name = "md2gdoc"
version = "0.1.0"
description = "Two-way sync between one markdown file and one native Google Doc"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client",
  "google-auth-oauthlib",
  "google-auth-httplib2",
]

[project.urls]
Homepage = "https://github.com/chadn/md2gdoc"

[project.scripts]
md2gdoc = "md2gdoc:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["md2gdoc.py"]

[tool.hatch.build.targets.sdist]
only-include = ["md2gdoc.py", "pyproject.toml", "README.md", "LICENSE"]
