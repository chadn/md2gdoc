# chadkit/config.yaml
#
# Declares deviations from ChadKit defaults; leave the rest commented out.
# See "The project config" in the ChadKit model (`chadkit model` says where) for the full shape.

chadkit-version: 0.7.0

# Omit paths that use ChadKit defaults.
# paths:
#   tasks: BACKLOG.md
#   task_archive: archive/completed-project-tasks.md

# Only needed when more than one decision container exists.
# decisions:
#   - path: docs/adr/
#     schema: docs/adr/README.md
#     scope: architecture
#     prefix: ADR
#   - path: chadkit/decisions/

overrides:
  - Greenfield: every artifact reads as native to this repository and cites no other project's records.

# Settings by workflow name; the CLI checks only the entries it knows. The QA
# gate (see the model's Workflows section; `chadkit model` says where) reads checks, paths, since.
workflows:
  qa-gate:
    from: user-ck@f95f135      # the shared qa-gate workflow, at that user-ck commit
    checks: scripts/gate-checks.sh
    # Where a change can alter what the tool promises or how the gate works; the rest is caught by the
    # line count (the shared qa-gate workflow, Tiers).
    paths:
      - chadkit/goals.md
      - chadkit/decisions/
      - chadkit/workflows/qa-gate.md
      - scripts/gate-checks.sh
    since: main                # audit dev_tasks commits not yet merged onto main
